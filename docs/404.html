<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mktero has moved</title>
    <link rel="canonical" href="https://mktero.com/">
    <meta name="robots" content="noindex">
    <script>
        (function () {
            const origin = 'https://mktero.com';
            const hashTargets = {
                '#privacy': '/privacy.html',
                '#evidence': '/#features',
                '#workflow': '/#workflow',
                '#top': '/',
            };
            const path = location.pathname.replace(/^\/mktero(?:\/|$)/i, '/');
            const normalized = path === '/index.html' ? '/' : (path || '/');
            const target = normalized === '/' && hashTargets[location.hash]
                ? hashTargets[location.hash]
                : normalized + location.search + location.hash;
            location.replace(origin + target);
        }());
    </script>
    <meta http-equiv="refresh" content="0; url=https://mktero.com/">
</head>
<body>
    <p>Mktero has moved to <a href="https://mktero.com/">https://mktero.com/</a>.</p>
    <p>Mktero 已迁移至 <a href="https://mktero.com/">https://mktero.com/</a>。</p>
</body>
</html>
